# Pruebas de logica y recorridos reales en Chrome, en cada empujon y pull request.
#
# Sin package.json, dependencias ni build. La imagen incluye Chrome.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # El recorrido de navegador usa WebSocket global, disponible en Node 22.
          node-version: '22'
      - run: node construir.mjs --check
      - run: node --test pruebas.mjs
      - run: node --test pruebas-navegador.mjs
